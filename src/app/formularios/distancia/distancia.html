<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distancia</title>
</head>

<body>

<div class="container">
  <div class="row pt-4">
    <div class="col-md-6">
      <h1>Distancia</h1>
      <form>
        <div class="form-group pt-2">
          <label>x2:</label>
          <input [(ngModel)]="num1" name="num1" type="text" class="form-control">
        </div>

        <div class="form-group pt-2">
          <label>x1:</label>
          <input [(ngModel)]="num2" name="num2" type="text" class="form-control">
        </div>

        <div class="form-group pt-2">
          <label>y2:</label>
          <input [(ngModel)]="num3" name="num3" type="text" class="form-control">
        </div>

        <div class="form-group pt-2">
          <label>y2:</label>
          <input [(ngModel)]="num4" name="num4" type="text" class="form-control">
        </div>

        <br>

        <button (click)="calcular()" type="button" class="btn btn-primary">
          Calcular
        </button>
      </form>
    </div>
  </div>
    <div class="col-md-6">
      <h3>Resultado: {{resultado}}</h3>
    </div>
</div>
<img src="https://exponty.com/wp-content/uploads/distancia-entre-dos-puntos-fi.png">
</body> 
</html>
